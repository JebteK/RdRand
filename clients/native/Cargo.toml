[package]
name = "rdrand-native"
version = "2.0.0"
edition = "2021"
publish = false
description = "Shared library exposing the CPU's hardware RNG (RDRAND/RNDR) to the Node.js, JVM and .NET rdrand.com clients"
license = "MIT"

[lib]
name = "rdrand_native"
crate-type = ["cdylib"]

[dependencies]
rdrand-client = { path = "../rust", default-features = false }
jni-sys = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
